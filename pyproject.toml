[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["fuel/tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py310"
line-length = 110
extend-exclude = ["fuel/migrations", "*_OLD.py", "scripts/probes"]

[tool.ruff.lint]
# E/F — помилки, I — порядок імпортів, B — типові баги, UP — сучасний синтаксис, DJ — Django
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
