<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Рух пального</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f5f6f8;color:#222}
header{background:#1f3a5f;color:#8ff;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;gap:20px}
header nav{display:flex;gap:18px;flex:1}
header a{color:inherit;text-decoration:none;font-weight:600}
header a:hover{text-decoration:underline}
header form{margin:0}
main{padding:20px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:15px}
.filters label{display:flex;flex-direction:column;font-size:12px;color:#555}
input,select,button{padding:6px 8px;font-size:14px}
table{border-collapse:collapse;width:100%;background:#fff;font-size:14px}
th,td{border-bottom:1px solid #e3e5e8;padding:6px 8px;text-align:left}
th{background:#eef0f3}
td.n,th.n{text-align:right}
.canceled{color:#999;text-decoration:line-through}
.topup{background:#f0f8ff}
.totals{margin:10px 0;font-weight:600}
.pager{margin-top:12px}
</style>
{% block extra_head %}{% endblock %}
</head>
<body>
<header>
  <strong>Рух пального</strong>
  <nav>
    {% if user.is_authenticated %}
      <a href="{% url 'transactions' %}">Транзакції</a>
      <a href="{% url 'cards' %}">Карти</a>
      {% if user.is_staff %}<a href="{% url 'admin:index' %}">Адмінка</a>{% endif %}
    {% endif %}
  </nav>
  {% if user.is_authenticated %}
    <form method="post" action="{% url 'logout' %}">{% csrf_token %} USER: {{ user.username }}
      <button>Вийти</button>
    </form>
  {% else %}
    <a href="{% url 'login' %}">Вхід</a>
  {% endif %}
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
